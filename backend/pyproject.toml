[project]
name = "dat-distiller"
version = "0.1.0"
description = "Local workbench for generating, labeling and training on synthetic data"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2",
    "pandas>=2.2",
    "pyarrow>=16",
]

[project.optional-dependencies]
# Heavy optional dependencies. Never required for `uv run pytest`: the code
# detects them and reports them as not installed (see dat_distiller.extras).
torch = [
    "torch>=2.2",
]
tensorflow = [
    "tensorflow>=2.16",
]
presidio = [
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "spacy>=3.7",
]
all = [
    "torch>=2.2",
    "tensorflow>=2.16",
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "spacy>=3.7",
]

[project.scripts]
dat-distiller = "dat_distiller.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dat_distiller"]

[tool.pytest.ini_options]
testpaths = ["tests"]
